services:
  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - APIMAKER_DATABASE_URL=${APIMAKER_DATABASE_URL:-sqlite:///./app/data/apimaker.db}
      - APIMAKER_ENVIRONMENT=${APIMAKER_ENVIRONMENT:-development}
      - APIMAKER_DEPLOY_HOST_PATH=${APIMAKER_DEPLOY_HOST_PATH:-.}
    volumes:
      - ./backend/app/data:/app/app/data
      - ./deployments:/app/deployments
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

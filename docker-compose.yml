version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - APIMAKER_DATABASE_URL=${APIMAKER_DATABASE_URL:-sqlite:///./app/data/apimaker.db}
      - APIMAKER_ENVIRONMENT=${APIMAKER_ENVIRONMENT:-development}
    volumes:
      - ./backend/app/data:/app/app/data
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apimaker-backend"
version = "0.1.0"
description = "Backend service for the API Maker project"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.18",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.0",
    "Jinja2>=3.1.0",
    "PyMySQL>=1.1.0",
    "psycopg2-binary>=2.9.9",
    "cryptography>=42.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "httpx>=0.27",
]

[project.scripts]
apimaker-backend = "app.main:app"

[tool.setuptools]
packages = ["app"]
